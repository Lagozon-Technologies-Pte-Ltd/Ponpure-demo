RELATIONSHIPS:

  - left_table: PONPURE_SALEORDERHDRS
    left_columns: [header_id]
    right_table: PONPURE_SALEORDERDTLS
    right_columns: [header_id]
    cardinality: OneToMany
    description: Sales Order Header to Sales Order Details. One sales order header can have multiple line items representing individual products or services within the order.

  - left_table: PONPURE_QUOTATIONHDRS
    left_columns: [quotation_number]
    right_table: PONPURE_SALEORDERHDRS
    right_columns: [quotation_number]
    cardinality: OneToMany
    description: Quotation Header to Sales Order Header. A single quotation can result in zero, one, or multiple sales orders, enabling analysis of quotation-to-order conversion and revenue realization.

  - left_table: PONPURE_LEADDETAILS
    left_columns: [customer_id]
    right_table: PONPURE_SALEORDERHDRS
    right_columns: [customer_id]
    cardinality: OneToMany
    description: Lead or Customer Master to Sales Order Header. A customer or lead can place multiple sales orders over time, supporting customer-wise sales performance and lifecycle analysis.

  - left_table: PONPURE_SALEORDERDTLS
    left_columns: [line_id]
    right_table: PONPURE_SCHEDULES
    right_columns: [sale_order_detail_line_id]
    cardinality: OneToMany
    description: Sales Order Details to Schedules. A single sales order line item can have multiple delivery schedules to support partial deliveries, staggered shipments, or phased fulfillment.

  - left_table: PONPURE_SALEORDERHDRS
    left_columns: [header_id]
    right_table: PONPURE_SCHEDULES
    right_columns: [sale_order_header_id]
    cardinality: OneToMany
    description: Sales Order Header to Schedules (derived relationship). A sales order can have multiple delivery schedules across its line items, useful for order-level fulfillment and logistics reporting.
