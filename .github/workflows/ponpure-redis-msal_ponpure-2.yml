name: Build and deploy Python app to Azure Web App - ponpure-2

on:
  push:
    branches:
      - Ponpure-Redis-msal
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip xmlstarlet

      - name: Zip Deploy to Azure App Service
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E2DAF01C0B90438486B5BFAEBC76ACEB }}
        run: |
          # Create zip (exclude junk)
          zip -r app.zip . \
            -x "antenv/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*"

          # Extract credentials from publish profile
          USERNAME=$(echo "$PUBLISH_PROFILE" | xmlstarlet sel -t -v "//publishProfile/@userName")
          PASSWORD=$(echo "$PUBLISH_PROFILE" | xmlstarlet sel -t -v "//publishProfile/@userPWD")

          # Zip deploy via Kudu (NO OneDeploy)
          curl -X POST \
            -u "$USERNAME:$PASSWORD" \
            --data-binary @app.zip \
            https://ponpure-2.scm.azurewebsites.net/api/zipdeploy
